<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#ff9c9c" />
    <title>티니핑 세상</title>
    <link rel="stylesheet" href="styles.css?v=figma-664-41273" />
  <link rel="stylesheet" href="redesign.css?v=ranking-rewards-no-score-1" />
    <link rel="stylesheet" href="menu-variant.css?v=empty-owned-popup-2" />
  </head>
  <body>
    <main class="webview-stage" aria-label="티니핑 세상 미니게임">
      <div class="screen-viewport" id="screenViewport">
        <section class="game-screen" id="gameScreen" data-node-id="1140:48602">
          <header class="status-bar" aria-label="상태 표시줄">
  <time class="status-time" id="statusTime">9:41</time>
  <div class="status-signals" aria-hidden="true"><img class="" style="" src="assets/redesign/imgCellularConnection.svg" alt="" draggable="false" /><img class="" style="" src="assets/redesign/imgWifi.svg" alt="" draggable="false" /><img class="" style="" src="assets/redesign/imgBattery.svg" alt="" draggable="false" /></div>
</header>

          <button class="round-control back-control" type="button" data-action="back" aria-label="뒤로 가기"><img class="" style="" src="assets/redesign/imgBtnBack.svg" alt="" draggable="false" /></button>

          <button class="soul-card" type="button" data-action="soul" aria-label="나의 소울 게이지">
  <img class="soul-bg" src="assets/redesign/soul-bg-4x.png" alt="" draggable="false" />
  <span class="soul-emblem" aria-hidden="true"><img class="emblem-outline" style="" src="assets/redesign/imgVector3.svg" alt="" draggable="false" /><img class="emblem-art" style="" src="assets/redesign/imgImage1894.png" alt="" draggable="false" /></span>
  <strong>나의 소울 게이지</strong>
  <span class="gauge-track"><span class="gauge-fill" id="gaugeFill"><img class="" style="" src="assets/redesign/soul-gauge-fill.svg" alt="" draggable="false" /></span><span class="gauge-value" id="gaugeValue">999999</span><span class="gauge-outline" aria-hidden="true"></span><span class="gauge-touch-shine" aria-hidden="true"></span></span>
  <span class="rank-summary" id="rankSummary" hidden><span>랭킹점수 <strong id="rankScoreValue"></strong>점</span><i aria-hidden="true"></i><span><strong id="rankPositionValue"></strong>위</span></span>
</button>

          <button class="round-control help-control" type="button" data-action="help" aria-label="참여방법"><img class="" style="" src="assets/redesign/imgBtnBack1.svg" alt="" draggable="false" /></button>



          <button class="demo-toggle" type="button" data-action="open-demo" aria-label="개발용 데모 패널 열기">
            <span aria-hidden="true">⚙</span> DEMO
          </button>

          <section class="world-scroll" id="worldScroll" aria-label="티니핑 세상">
            <div class="ping-world" id="pingWorld" aria-live="polite"></div>
          </section>

<nav class="side-actions" aria-label="꾸미기 메뉴">
<button class="side-button background-button" type="button" data-action="background"><span class="side-icon"><img class="" style="" src="assets/redesign/imgImage1880.png" alt="" draggable="false" /><img class="side-screen" style="" src="assets/redesign/imgImage1880.png" alt="" draggable="false" /></span><span class="side-label">배경 바꾸기</span></button>
<button class="side-button booth-button" type="button" data-action="booth"><span class="side-icon"><img class="" style="" src="assets/redesign/imgImage1885.png" alt="" draggable="false" /></span><span class="side-label">티니핑 부스</span></button>
</nav>
<nav class="bottom-actions variant-bottom-actions" aria-label="게임 메뉴" data-node-id="1147:50190">
<button class="menu-button menu-ranking" type="button" data-action="ranking"><img class="variant-menu-card" src="assets/menu-variant/imgRectangle346601023.svg" alt="" draggable="false" /><img class="variant-menu-icon" src="assets/menu-variant/imgIc.png" alt="" draggable="false" /><span class="variant-menu-label">랭킹</span></button>
<button class="menu-button menu-book" type="button" data-action="collection"><img class="variant-menu-card" src="assets/menu-variant/imgRectangle346601023.svg" alt="" draggable="false" /><img class="variant-menu-icon" src="assets/menu-variant/imgImage1875.png" alt="" draggable="false" /><span class="variant-menu-label">도감</span></button>
<button class="menu-button menu-draw" type="button" data-action="draw"><img class="variant-menu-card" src="assets/menu-variant/imgRectangle346601023.svg" alt="" draggable="false" /><img class="variant-menu-icon" src="assets/menu-variant/imgImage1876.png" alt="" draggable="false" /><span class="variant-menu-label">뽑기</span></button>
<button class="menu-button charge-button" type="button" data-action="charge"><img class="variant-menu-card" src="assets/menu-variant/imgRectangle346601022.svg" alt="" draggable="false" /><img class="variant-charge-icon" src="assets/menu-variant/charge-icon.png" alt="" draggable="false" /><span class="variant-menu-label">한번에<br>충전하기</span></button>
</nav>
          <div class="home-indicator" aria-hidden="true"><span></span></div>

          <div class="sheet-layer" id="sheetLayer" hidden>
            <button class="sheet-dim" type="button" data-action="close-sheet" aria-label="닫기"></button>
            <section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
              <span class="sheet-handle" aria-hidden="true"></span>
              <button class="sheet-close" type="button" data-action="close-sheet" aria-label="팝업 닫기">✕</button>
              <div class="sheet-emoji" id="sheetEmoji" aria-hidden="true">✨</div>
              <h2 id="sheetTitle">안내</h2>
              <div class="sheet-content" id="sheetContent"></div>
              <button class="sheet-primary" type="button" id="sheetPrimary">확인</button>
            </section>
          </div>

          <div class="demo-layer" id="demoLayer" hidden>
            <button class="demo-dim" type="button" data-action="close-demo" aria-label="데모 패널 닫기"></button>
            <aside class="demo-panel" role="dialog" aria-modal="true" aria-labelledby="demoTitle">
              <header class="demo-header">
                <div>
                  <span class="demo-eyebrow">DEVELOPER TOOLS</span>
                  <h2 id="demoTitle">데모 패널</h2>
                </div>
                <button class="demo-close" type="button" data-action="close-demo" aria-label="데모 패널 닫기">✕</button>
              </header>

              <div class="demo-summary" aria-live="polite">
                <span><small>전체 게이지</small><strong id="demoGaugeSummary">100%</strong></span>
                <span><small>보유 티니핑</small><strong id="demoCountSummary">10 / 30</strong></span>
              </div>
              <p class="demo-pause-note"><span aria-hidden="true">Ⅱ</span> 패널을 연 동안 XP 자동 감소가 일시정지됩니다.</p>

              <section class="demo-control-group" aria-labelledby="demoXpLabel">
                <div class="demo-control-head">
                  <div>
                    <span class="demo-step">01</span>
                    <strong id="demoXpLabel">게이지양</strong>
                  </div>
                  <label class="demo-number-wrap">
                    <span class="sr-only">게이지 직접 입력</span>
                    <input id="demoXpNumber" type="number" min="0" max="100" step="1" value="100" inputmode="numeric" />
                    <span>%</span>
                  </label>
                </div>
                <input class="demo-range demo-xp-range" id="demoXpRange" type="range" min="0" max="100" step="1" value="100" aria-labelledby="demoXpLabel" />
                <div class="demo-presets" aria-label="게이지 빠른 설정">
                  <button type="button" data-demo-xp="0">0%</button>
                  <button type="button" data-demo-xp="30">30%</button>
                  <button type="button" data-demo-xp="50">50%</button>
                  <button type="button" data-demo-xp="100">100%</button>
                </div>
                <p class="demo-hint">보유 티니핑의 XP 비율을 변경해요. Base XP 30% 아래로는 내려가지 않아요.</p>
              </section>

              <section class="demo-control-group" aria-labelledby="demoCountLabel">
                <div class="demo-control-head">
                  <div>
                    <span class="demo-step">02</span>
                    <strong id="demoCountLabel">보유 티니핑</strong>
                  </div>
                  <div class="demo-stepper" aria-label="보유 티니핑 마릿수 조절">
                    <button type="button" data-demo-count-delta="-1" aria-label="한 마리 줄이기">−</button>
                    <output id="demoCountOutput" for="demoCountRange">10마리</output>
                    <button type="button" data-demo-count-delta="1" aria-label="한 마리 늘리기">＋</button>
                  </div>
                </div>
                <input class="demo-range demo-count-range" id="demoCountRange" type="range" min="0" max="30" step="1" value="10" aria-labelledby="demoCountLabel" />
                <div class="demo-presets" aria-label="보유 마릿수 빠른 설정">
                  <button type="button" data-demo-count="0">0마리</button>
                  <button type="button" data-demo-count="1">1마리</button>
                  <button type="button" data-demo-count="5">5마리</button>
                  <button type="button" data-demo-count="10">10마리</button>
                  <button type="button" data-demo-count="15">15마리</button>
                  <button type="button" data-demo-count="20">20마리</button>
                  <button type="button" data-demo-count="25">25마리</button>
                  <button type="button" data-demo-count="30">30마리</button>
                </div>
                <p class="demo-hint">한 마리 늘리기를 누르면 패널이 닫히고 소환 연출을 확인할 수 있어요.</p>
              </section>

              <section class="demo-control-group demo-visibility-control" aria-labelledby="demoRankDisplayLabel">
                <div class="demo-control-head">
                  <div>
                    <span class="demo-step">03</span>
                    <strong id="demoRankDisplayLabel">점수·순위 표시</strong>
                  </div>
                  <label class="demo-switch">
                    <input id="demoRankVisibility" type="checkbox" checked />
                    <span aria-hidden="true"></span>
                    <em>표시</em>
                  </label>
                </div>
                <p class="demo-hint">상단 소울게이지 아래의 랭킹점수와 순위 노출 여부를 변경합니다.</p>
              </section>

              <div class="demo-footer">
                <button class="demo-reset" type="button" data-action="reset-demo">초기 상태로</button>
                <button class="demo-done" type="button" data-action="close-demo">적용 완료</button>
              </div>
            </aside>
          </div>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script src="policy-engine.js?v=ranking-rewards-no-score-1"></script>
    <script src="menu-variant.js?v=empty-owned-popup-2"></script>
  </body>
</html>
